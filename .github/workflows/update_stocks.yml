name: Update Stocks (Polygon)

on:
  schedule:
    # Every 30 min during US market session (Mon–Fri). Times are UTC.
    - cron: "*/30 14-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stocks-csv
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy requests pytz arch

      - name: Run updater (stocks only)
        run: python Automation.py
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          # True when manually dispatched; script treats 'true' as FORCE_RUN
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- stocks.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.csv
          git commit -m "📈 Auto-update stocks.csv (stocks)"
          git push

      - name: Send Trade Summary Email
        if: always()   # send regardless of whether CSV changed
        run: python send_email.py
        env:
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_HOST:  ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT:  ${{ secrets.EMAIL_SMTP_PORT }}
          # If your SMTP requires SSL on 465, uncomment:
          # EMAIL_SMTP_SSL: "true"
