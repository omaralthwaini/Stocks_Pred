name: Update Crypto (CryptoCompare)

on:
  schedule:
    # Every 3 hours, 24/7 (UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Same group as stocks to avoid concurrent writes to stocks.csv
  group: stocks-csv
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run updater (crypto only)
        run: python Crypto.py
        env:
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTO_API_KEY }}

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- stocks.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.csv
          git commit -m "🪙 Auto-update stocks.csv (crypto)"
          git push
