name: Auto Update Stocks & Crypto

on:
  schedule:
    # Every 30 min during US stock session (Mon–Fri).
    - cron: "*/30 14-21 * * 1-5"
    # Daily run (7 days/wk) so crypto gets refreshed.
    - cron: "15 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-update-stocks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"     # speed up installs across runs

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pytz scipy statsmodels arch

      - name: Run updater
        run: python Automation.py
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Run crypto updater
        run: python Crypto.py
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- stocks.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.csv
          git commit -m "📈 Auto-update stocks.csv"
          git push

      # Send trade summary email (uncomment when ready)
