name: Auto Update Stocks & Crypto

on:
  schedule:
    # Every 30 min during US stock session (Mon–Fri). The script itself skips stocks if out of hours.
    - cron: "*/30 14-21 * * 1-5"
    # Daily run (7 days/wk) so crypto (and yesterday’s candle) get refreshed.
    - cron: "15 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-update-stocks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"     # speed up installs across runs

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # arch is needed by send_email.py (for GARCH); scipy & statsmodels are common deps
          pip install pandas numpy requests pytz scipy statsmodels arch

      - name: Run updater
        run: python Automation.py
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          # When you click “Run workflow” manually, this lets stock updates run even outside market hours
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- stocks.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.csv
          git commit -m "📈 Auto-update stocks.csv"
          git push

      # Send the daily signal summary email (only if all required secrets exist)
      - name: Send Trade Summary Email
        if: ${{ secrets.EMAIL_USER && secrets.EMAIL_PASS && secrets.EMAIL_TO && secrets.EMAIL_SMTP_HOST && secrets.EMAIL_SMTP_PORT }}
        run: python send_email.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          # If your SMTP requires SSL on 465, uncomment the next line and handle SSL in send_email.py
          # EMAIL_SMTP_SSL: "true"
