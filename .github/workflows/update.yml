name: Auto Update Stocks & Crypto

on:
  schedule:
    # Run every 30 minutes during the US stock session (Mon–Fri).
    # The script itself will skip stock updates outside market hours.
    - cron: "*/30 14-21 * * 1-5"
    # Daily run (7 days/wk) so crypto is refreshed & yesterday gets finalized.
    - cron: "15 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-update-stocks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pytz

      - name: Run updater
        run: python Automation.py
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          # When you click "Run workflow" manually in GitHub,
          # FORCE_RUN=true lets stocks update even if outside market hours.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Commit & push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.csv
          git commit -m "📈 Auto-update stocks.csv" || echo "No changes to commit"
          git push
